suites:
  - name: Event Discovery
    status: deprecated
    cases:
      - title: Canceled Ticketmaster events are excluded
        qase_id: 1
        description: >-
          Canceled Ticketmaster events must be removed before the agent sees
          search results or selects recommendations.
        preconditions: >-
          A Ticketmaster Discovery API response includes an event whose
          dates.status.code is canceled.
        priority: high
        automated: true
        steps:
          - action: Execute event search with a canceled Ticketmaster event.
            expected: Ticketmaster response is processed successfully.
          - action: Apply event eligibility filtering.
            expected: The canceled event is excluded from eligible results.
          - action: Inspect model-visible search results.
            expected: The canceled event ID is not present and cannot be recommended.
          - action: Inspect structured logs.
            expected: event.action=ticketmaster_event_filter and event.reason=canceled.

      - title: Non-canceled Ticketmaster statuses remain eligible
        qase_id: 10
        description: >-
          Status filtering must preserve active and changed events while dropping
          only events explicitly marked canceled.
        preconditions: >-
          Ticketmaster returns events marked onsale, offsale, postponed, or rescheduled.
        priority: medium
        automated: true
        steps:
          - action: Execute discovery separately for each supported non-canceled status.
            expected: The Ticketmaster response is processed successfully.
          - action: Apply event eligibility filtering.
            expected: Onsale, offsale, postponed, and rescheduled events remain eligible.

      - title: Pagination reaches eligible unseen events within safety bounds
        qase_id: 11
        description: >-
          Discovery must continue past seen or ineligible results while limiting
          both model-visible candidates and Ticketmaster API requests.
        preconditions: >-
          Ticketmaster provides paginated responses containing a mixture of seen,
          canceled, and eligible unseen events.
        priority: medium
        automated: true
        steps:
          - action: Return only previously seen events on the first API page and unseen events on the next page.
            expected: Discovery fetches the later page and returns its eligible unseen events.
          - action: Include canceled events before the ten-event target is reached.
            expected: Canceled events do not count toward the target and pagination continues.
          - action: Provide ten eligible unseen events on the first page.
            expected: Discovery stops without requesting another page.
          - action: Exhaust Ticketmaster page metadata before ten eligible events are found.
            expected: Discovery stops at the reported final page.
          - action: Report additional pages beyond the configured safety boundary.
            expected: At most five API pages and ten model-visible events are processed.

      - title: Ticketmaster discovery failures are credential-safe
        qase_id: 12
        description: >-
          Ticketmaster request failures remain useful to the agent without
          exposing the provider API key in exceptions, logs, or tool output.
        preconditions: >-
          Ticketmaster returns an HTTP failure whose request URL contains the API key.
        priority: high
        automated: true
        steps:
          - action: Execute Ticketmaster discovery and return an HTTP error.
            expected: The provider raises a concise status-based error without chaining credential-bearing request details.
          - action: Pass the provider failure through the agent tool loop.
            expected: The model receives a recoverable credential-free tool error.
          - action: Inspect application logs and formatted exceptions.
            expected: The Ticketmaster API key is absent.

  - name: Agent Grounding & Selection
    status: deprecated
    cases:
      - title: Recommendations require successfully grounded event IDs
        qase_id: 2
        description: >-
          The agent may select only events grounded by successful tool calls;
          failed calls and invented IDs must not become recommendations.
        preconditions: >-
          The agent receives controlled tool results and a final recommendation response.
        priority: high
        automated: true
        steps:
          - action: Return an unknown event ID in the final recommendation response.
            expected: Recommendation validation rejects the unknown ID.
          - action: Return event details successfully, then recommend that event ID.
            expected: The ID is accepted as grounded.
          - action: Fail an event-details tool call, then recommend its requested ID.
            expected: The tool error is returned to the model and the ID remains ungrounded.
          - action: Inspect the successful agent result after selecting a subset of discovered events.
            expected: Only selected recommendation IDs appear in recommended_event_ids.

      - title: Seen and same-run duplicate events are excluded
        qase_id: 3
        description: >-
          Prior history and earlier search results in the same run must not be
          presented to the model again as fresh candidates.
        preconditions: >-
          A seen ID is supplied and consecutive searches return an overlapping event ID.
        priority: medium
        automated: true
        steps:
          - action: Run the first event search with one seen and one new event.
            expected: Only the new event is visible in the tool result.
          - action: Run a second search returning the same new event and another new event.
            expected: The repeated ID is excluded and only the fresh event is visible.

      - title: Model-visible search results contain no Admission or ticket prices
        qase_id: 4
        description: >-
          Provider pricing remains internal and is not exposed in event data sent to the LLM.
        preconditions: >-
          A successful search returns an event with provider Admission and distinctive price values.
        priority: high
        automated: true
        steps:
          - action: Execute the event search through the agent tool loop.
            expected: The event ID is available for grounded selection.
          - action: Inspect the search result sent in the OpenAI continuation.
            expected: It contains no Admission field, price fields, or provider price values.

      - title: Provider Admission remains authoritative in final recommendations
        qase_id: 5
        description: >-
          Recommendation parsing uses internally retained provider Admission,
          including after a successful event-details lookup.
        preconditions: >-
          Search discovers an event with Admission and the model selects its event ID.
        priority: high
        automated: true
        steps:
          - action: Parse the model's final recommendation for the discovered event.
            expected: The Recommendation receives the Admission supplied by the provider.
          - action: Fetch event details after search and parse the final recommendation again.
            expected: The details lookup does not erase the Admission discovered during search.

      - title: Model-visible search results are capped at ten eligible events
        qase_id: 6
        description: >-
          The agent must not expose more than ten eligible unseen events from one search result.
        preconditions: >-
          A tool returns more than ten events, including an ID already seen before the run.
        priority: medium
        automated: true
        steps:
          - action: Process the oversized event-search result.
            expected: The seen event is filtered out before selecting candidates.
          - action: Inspect model-visible output and the agent's grounded event IDs.
            expected: No more than ten fresh events are exposed or grounded.

  - name: Price Enrichment
    status: deprecated
    cases:
      - title: Only final Ticketmaster recommendations are price-enriched
        qase_id: 7
        description: >-
          Enrichment scrapes only selected recommendations with valid Ticketmaster URLs.
        preconditions: >-
          Final recommendations include Ticketmaster, non-Ticketmaster, and malformed URLs.
        priority: medium
        automated: true
        steps:
          - action: Run price enrichment for the final recommendation list.
            expected: Only valid Ticketmaster event URLs are sent to the scraper.
          - action: Inspect recommendations with non-Ticketmaster or malformed URLs.
            expected: They are not scraped, and any existing Admission is unchanged.

      - title: Successful scrape replaces prior Admission with provider pricing
        qase_id: 8
        description: >-
          A successful Ticketmaster page scrape becomes the authoritative Admission
          for the selected recommendation.
        preconditions: >-
          A selected Ticketmaster recommendation has existing Admission and the scraper returns a different Admission.
        priority: high
        automated: true
        steps:
          - action: Enrich the selected Ticketmaster recommendation.
            expected: The scraper returns a valid provider Admission.
          - action: Inspect the recommendation after enrichment.
            expected: Its prior Admission is replaced by the scraped provider Admission.

      - title: Unavailable or failed price scraping preserves Admission and continues
        qase_id: 9
        description: >-
          Missing prices or an individual scraper failure must not erase existing
          Admission or prevent later recommendations from being enriched.
        preconditions: >-
          A batch contains Ticketmaster recommendations with an existing Admission,
          an unavailable or failing scrape, and another event with an available price.
        priority: high
        automated: true
        steps:
          - action: Return no price for one recommendation.
            expected: Its existing Admission is preserved.
          - action: Raise a scraper error for another recommendation in the batch.
            expected: Enrichment does not fail the batch.
          - action: Process a subsequent recommendation with a successful scrape.
            expected: Its scraped Admission is applied.

      - title: Visible PLN prices are extracted deterministically
        qase_id: 13
        description: >-
          Visible provider prices are converted into a deterministic PLN
          Admission without requiring a specific ticket-section heading.
        preconditions: >-
          A Ticketmaster event page exposes one or more supported visible PLN prices.
        priority: high
        automated: true
        steps:
          - action: Load an event page with visible fixed or ranged PLN prices.
            expected: All supported visible prices are extracted from the rendered page.
          - action: Repeat with Polish ticket text or without a known ticket-section marker.
            expected: Price extraction remains available independently of the heading variant.
          - action: Inspect the returned Admission.
            expected: Currency is PLN and minimum and maximum values reflect the provider prices.

      - title: Localized consent handling is selective and non-fatal
        qase_id: 14
        description: >-
          Polish and English consent controls are handled without making the
          privacy modal a hard dependency for price extraction.
        preconditions: >-
          Ticketmaster may render a localized consent dialog before the ticket UI.
        priority: medium
        automated: true
        steps:
          - action: Render a visible English or Polish consent acceptance control.
            expected: The accept control is clicked and extraction continues; reject-all is never selected.
          - action: Omit the consent dialog or make its accept click fail.
            expected: The scraper continues through its existing non-fatal extraction path.

      - title: Bounded readiness reaches localized best-available prices
        qase_id: 15
        description: >-
          Readiness waits for actionable ticket content and supports Polish and
          English best-available controls without accepting accessibility-only markers.
        preconditions: >-
          Ticketmaster initially renders no price and later exposes an interactive ticket-selection control.
        priority: medium
        automated: true
        steps:
          - action: Render only an accessibility skip-to-tickets marker before the interactive ticket UI.
            expected: The marker alone does not complete readiness and polling continues within its bound.
          - action: Later render the English or Polish best-available control.
            expected: Readiness completes when the actionable control becomes visible.
          - action: Click the localized control and reveal a provider price.
            expected: The post-click PLN price is extracted into Admission.

      - title: Unavailable or blocked pages never imply free admission
        qase_id: 16
        description: >-
          Pages without extractable provider pricing return pricing unavailable
          rather than creating a free Admission or failing the wider batch.
        preconditions: >-
          The event page is blocked, navigation fails, controls are unavailable,
          or a best-available interaction reveals no price.
        priority: high
        automated: true
        steps:
          - action: Scrape a verification page or a page with no price and no actionable control.
            expected: The scraper returns no Admission.
          - action: Fail navigation or the best-available click.
            expected: The scraper reports pricing unavailable without raising to the batch.
          - action: Complete a best-available click that reveals no price.
            expected: The result remains unavailable and is never interpreted as free admission.

  - name: Delivery & Persistence
    status: deprecated
    cases:
      - title: Enriched provider prices are rendered in Telegram output
        qase_id: 17
        description: >-
          Deterministic Admission produced after recommendation selection is the
          price source used by the Telegram formatter.
        preconditions: >-
          A final Ticketmaster recommendation is enriched with a visible provider price range.
        priority: high
        automated: true
        steps:
          - action: Enrich the selected recommendation with a Ticketmaster Admission.
            expected: The deterministic Recommendation contains the scraped provider price range.
          - action: Format the enriched recommendation for Telegram.
            expected: The Telegram message displays the same PLN range in the expected localized format.

      - title: History is persisted only after successful Telegram delivery
        qase_id: 18
        description: >-
          The daily pipeline persists only selected recommendation IDs and only
          after Telegram accepts the formatted report.
        preconditions: >-
          History contains prior IDs and the agent returns a defined set of final recommendations.
        priority: high
        automated: true
        steps:
          - action: Run the successful daily pipeline through agent selection, enrichment, formatting, and delivery.
            expected: Telegram delivery occurs before history persistence.
          - action: Inspect the IDs written after delivery.
            expected: Prior history is combined only with final recommended event IDs.
          - action: Make Telegram delivery fail.
            expected: No history is written and no successful daily-run summary is emitted.
          - action: Make history persistence fail after successful delivery.
            expected: The persistence error remains visible and the run is not logged as successful.

      - title: Telegram delivery failures never expose bot credentials
        qase_id: 19
        description: >-
          Telegram transport failures preserve failure semantics while removing
          the bot token from logs and exception output.
        preconditions: >-
          The Telegram HTTP client fails with an error containing the credentialed Bot API URL.
        priority: high
        automated: true
        steps:
          - action: Attempt to deliver a Telegram report and raise a credential-bearing transport error.
            expected: Delivery raises the existing concise application error.
          - action: Inspect the exception, traceback, and application logs.
            expected: The Telegram bot token and credentialed URL are absent.

  - name: Observability & Runtime
    status: deprecated
    cases:
      - title: ECS stdout logs include stable service and pipeline diagnostics
        qase_id: 20
        description: >-
          Application logs remain one-line ECS JSON and expose structured fields
          for the discovery, scraping, and successful daily-run stages.
        preconditions: >-
          Elastic export is disabled and application stages execute with controlled results.
        priority: medium
        automated: true
        steps:
          - action: Configure logging and emit a record with structured extras.
            expected: Stdout contains valid ECS JSON with event fields and stable event-agent production service metadata.
          - action: Configure logging a second time and emit one record.
            expected: Exactly one stdout record is produced.
          - action: Complete Ticketmaster discovery, a price scrape, and a successful daily run.
            expected: Search counters, scrape outcome fields, and daily duration/event counters are emitted as structured diagnostics.
          - action: Inspect price-scrape logging output.
            expected: Diagnostic fields are present without rendered page body text.

      - title: Optional OTLP log export is idempotent and flushed at shutdown
        qase_id: 21
        description: >-
          Complete Elastic configuration adds one OTLP pipeline, preserves
          structured attributes, and flushes the short-lived job exactly once.
        preconditions: >-
          Both the Elastic Managed OTLP endpoint and API key are configured and the exporter is mocked.
        priority: medium
        automated: true
        steps:
          - action: Configure application logging twice with complete Elastic settings.
            expected: One ECS handler, one OTLP handler, and one exporter pipeline exist.
          - action: Emit a structured price-scrape record.
            expected: Its event and scraper extras are exported as OpenTelemetry log attributes.
          - action: Shut down logging twice.
            expected: The provider flushes, shuts down, and removes its handler exactly once.

      - title: Telemetry failures are non-fatal and credential-safe
        qase_id: 22
        description: >-
          Optional telemetry configuration and export failures cannot alter the
          daily delivery pipeline or expose the Elastic API key.
        preconditions: >-
          Elastic settings are incomplete, exporter setup fails, or summary logging raises.
        priority: high
        automated: true
        steps:
          - action: Configure only one required Elastic setting.
            expected: OTLP export remains disabled and a concise credential-free warning is emitted.
          - action: Fail OTLP exporter setup with an error containing the API key.
            expected: ECS stdout remains available and neither the key nor authorization data is logged.
          - action: Raise while emitting the final daily summary after successful delivery and persistence.
            expected: The logging failure does not fail delivery, persistence, or logging cleanup.

      - title: Camoufox batch lifecycle reuses resources and honors optional proxy
        qase_id: 23
        description: >-
          Price enrichment owns one Camoufox browser and context per batch while
          cleaning up every page and applying proxy configuration only when supplied.
        preconditions: >-
          A batch contains multiple final Ticketmaster recommendations and Camoufox is mocked.
        priority: medium
        automated: true
        steps:
          - action: Enrich multiple Ticketmaster recommendations in one batch.
            expected: One scraper, browser, and context are reused while a separate page is created per event.
          - action: Complete or fail individual page scraping.
            expected: Each page is closed without preventing later batch items from running.
          - action: Run once without SCRAPER_PROXY_URL and once with the local SOCKS5 URL.
            expected: Camoufox receives proxy options only for the configured run.
          - action: Exit the scraper lifecycle.
            expected: Browser and Playwright resources are closed exactly once.

  - name: System
    status: active
    cases:
      - title: Daily job happy path completes delivery and persists history
        qase_id: 28
        description: >-
          The production daily container completes the deterministic discovery,
          recommendation, delivery, and history-persistence flow against controlled services.
        preconditions: >-
          The production image runs against the happy-path fake external services scenario.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container with controlled OpenAI, Ticketmaster, and Telegram endpoints.
            expected: The container exits successfully after a grounded recommendation is delivered.
          - action: Inspect the request journal, persisted history, and ECS logs.
            expected: The selected event is delivered and persisted, credentials are redacted, and daily_run has outcome success.

      - title: Telegram failure prevents history persistence
        qase_id: 29
        description: >-
          A Telegram transport failure fails the daily container without recording
          an event that was not successfully delivered.
        preconditions: >-
          The production image runs against fake services that return a Telegram 5xx response.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container with a recommendation and failing Telegram delivery.
            expected: The container exits with an error after one Telegram delivery attempt.
          - action: Inspect persisted history and logs.
            expected: No new event ID is persisted, secrets are absent, and no successful daily_run record is emitted.

      - title: No eligible events sends an explicit no-events notification
        qase_id: 30
        description: >-
          A successful run with no eligible events delivers a concise informational
          notification instead of an empty recommendations report.
        preconditions: >-
          The production image runs against fake Ticketmaster and OpenAI responses containing no recommendations.
        priority: medium
        automated: true
        steps:
          - action: Run the production daily container with no eligible events.
            expected: The container exits successfully and Telegram receives the explicit no-events notification.
          - action: Inspect the Telegram body, history, and ECS logs.
            expected: No recommendation is represented, no event ID is added to history, and daily_run has outcome success.

      - title: Previously seen events are not delivered again
        qase_id: 31
        description: >-
          Existing history prevents a previously delivered Ticketmaster event from
          appearing again in the final daily report.
        preconditions: >-
          The production image starts with a seen_events.json containing the candidate event ID.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container when Ticketmaster returns the previously seen event.
            expected: The event is removed before the model-visible tool result and is not delivered by Telegram.
          - action: Inspect history after the successful run.
            expected: The original seen event ID remains the only stored ID.

      - title: Canceled Ticketmaster events are filtered before recommendation
        qase_id: 32
        description: >-
          Ticketmaster events marked canceled never become model-visible candidates
          or delivered recommendations in the production flow.
        preconditions: >-
          Fake Ticketmaster returns both a canceled event and an eligible event.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container against the canceled-event fake scenario.
            expected: Only the eligible event is passed in the OpenAI tool output and delivered through Telegram.
          - action: Inspect saved history and logs.
            expected: Only the eligible event ID is persisted and the canceled event is absent from the delivered report.

      - title: OpenAI failure prevents delivery and partial history persistence
        qase_id: 33
        description: >-
          An OpenAI Responses API failure aborts the batch before external delivery
          or history mutation.
        preconditions: >-
          The production image runs against fake OpenAI that returns a controlled failure.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container with a failing initial OpenAI request.
            expected: The container exits with an error before Ticketmaster discovery or Telegram delivery.
          - action: Inspect the journal, persisted history, and logs.
            expected: Telegram is not called, history is unchanged, secrets are absent, and no successful daily_run record is emitted.

      - title: Only delivered recommendations are persisted from multiple candidates
        qase_id: 34
        description: >-
          When discovery returns multiple candidates, persistence records only the
          event selected and delivered in the final recommendation.
        preconditions: >-
          The production image runs against fake services with multiple Ticketmaster events and one deterministic selection.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container against the multiple-events fake scenario.
            expected: Telegram contains only the selected recommendation.
          - action: Inspect seen_events.json after successful delivery.
            expected: History contains only the selected and delivered event ID.

      - title: Ticketmaster failure prevents delivery and persistence
        qase_id: 35
        description: >-
          A Ticketmaster Discovery failure must fail the production job without
          being interpreted as a successful no-events result.
        preconditions: >-
          The production image runs against fake services whose Ticketmaster
          Discovery endpoint returns a controlled HTTP 5xx response.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container with a failing Ticketmaster Discovery request.
            expected: The container exits with a non-zero status after the discovery request fails.
          - action: Inspect Telegram requests and the data directory.
            expected: Telegram is not called and no seen_events.json entry is created or changed.
          - action: Inspect ECS logs and the failed tool output journal.
            expected: The run does not emit daily_run success or a no-events notification, and the API key is redacted.

      - title: Ungrounded recommendation is rejected before delivery
        qase_id: 36
        description: >-
          A recommendation ID not present in the grounded Ticketmaster candidate
          set must fail the production run before delivery or persistence.
        preconditions: >-
          Fake OpenAI returns an unknown event ID after a successful Ticketmaster search.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container through a successful search and an ungrounded final recommendation.
            expected: The container rejects the recommendation and exits with a non-zero status.
          - action: Inspect the OpenAI journal, Telegram requests, and data directory.
            expected: The search/tool loop occurred, but Telegram is not called and no history entry is written.
          - action: Inspect logs and captured artifacts.
            expected: The unknown recommendation is not delivered and credentials are absent from observable output.

      - title: Mixed-source discovery deduplicates and persists canonical event
        qase_id: 37
        description: >-
          Ticketmaster and MOSiR candidates are normalized and conservatively
          deduplicated before model selection, while the delivered MOSiR event
          retains provider-authoritative identity and URL.
        preconditions: >-
          The production image runs against controlled Ticketmaster and MOSiR
          fakes containing one cross-source duplicate and one unique MOSiR event.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container against the mixed-source fake scenario.
            expected: The model-visible search result contains the canonical Ticketmaster duplicate and the unique MOSiR event, but not the duplicate MOSiR event.
          - action: Let the controlled OpenAI response select the unique MOSiR event.
            expected: Telegram receives the MOSiR event with its canonical provider URL and no Ticketmaster price scrape is attempted.
          - action: Inspect seen_events.json and structured ECS logs after delivery.
            expected: History contains only the namespaced MOSiR ID, and the deduplication log identifies Ticketmaster as kept and MOSiR as dropped.

      - title: Partial source failure still delivers available events
        qase_id: 38
        description: >-
          A Ticketmaster Discovery failure must not prevent delivery when the
          MOSiR source successfully returns a grounded event.
        preconditions: >-
          The production image runs against controlled services where
          Ticketmaster returns HTTP 503 and MOSiR returns one valid event.
        priority: high
        automated: true
        steps:
          - action: Run the production daily container against the partial-source-failure scenario.
            expected: The container exits successfully after OpenAI selects the available MOSiR event.
          - action: Inspect the request journal, Telegram message, and seen_events.json.
            expected: Ticketmaster fails, MOSiR is delivered with its canonical URL, and only its namespaced ID is persisted.
          - action: Inspect structured ECS logs.
            expected: Ticketmaster has a failed source search, MOSiR has a successful source search, and the catalog summary has degraded=true.

  - name: System Integration
    status: active
    cases:
      - title: Ticketmaster Discovery API is reachable with valid credentials
        qase_id: 24
        description: >-
          This live smoke check verifies authenticated connectivity to the
          Ticketmaster Discovery API without depending on a fixed event.
        preconditions: >-
          Smoke tests are enabled with --run-smoke and TICKETMASTER_API_KEY is configured.
        priority: high
        automated: true
        steps:
          - action: Execute the live Ticketmaster discovery smoke request.
            expected: The authenticated Discovery API request completes successfully.
          - action: Inspect the returned HTTP response.
            expected: The API returns a successful response with a valid discovery result shape.

      - title: Telegram bot authentication succeeds without sending a message
        qase_id: 25
        description: >-
          This live smoke check validates Telegram bot credentials through getMe
          without invoking message delivery.
        preconditions: >-
          Smoke tests are enabled with --run-smoke and TELEGRAM_BOT_TOKEN is configured.
        priority: high
        automated: true
        steps:
          - action: Call the live Telegram Bot API getMe method with the configured token.
            expected: Telegram returns HTTP/API success and a valid bot identity.
          - action: Complete the smoke check without invoking sendMessage.
            expected: No Telegram message is sent and no application state is changed.

      - title: Camoufox can reach Ticketmaster through the configured browser network path
        qase_id: 26
        description: >-
          This live smoke check validates real headed Camoufox startup and
          Ticketmaster page connectivity over direct networking or SCRAPER_PROXY_URL.
          It does not invoke or validate ticket-price extraction.
        preconditions: >-
          Smoke tests are enabled with --run-smoke and the Camoufox browser payload is installed.
        priority: high
        automated: true
        steps:
          - action: Start Camoufox with the production browser settings and optional configured proxy.
            expected: The browser and context start successfully.
          - action: Navigate to the public Ticketmaster Poland home page.
            expected: Navigation reaches a successful Ticketmaster URL with non-empty branded page content.
          - action: Complete the smoke check and close browser resources.
            expected: Page, context, browser, and Playwright resources are closed reliably.

      - title: Elastic OTLP endpoint accepts an event-agent log record
        qase_id: 27
        description: >-
          This live smoke check validates direct OTLP/HTTP log ingestion
          connectivity without asserting downstream indexing or dashboard visibility.
        preconditions: >-
          Smoke tests are enabled with --run-smoke and ELASTIC_OTLP_ENDPOINT and ELASTIC_API_KEY are configured.
        priority: medium
        automated: true
        steps:
          - action: Send one minimal event-agent OTLP JSON log record to the normalized logs endpoint.
            expected: Elastic accepts the authenticated request with a successful 2xx response.
          - action: Inspect the record submitted by the smoke check.
            expected: It contains smoke service metadata, success event fields, a current timestamp, and the expected message body.

      - title: MOSiR Tychy live event discovery
        qase_id: 39
        description: >-
          This live smoke check validates production MOSiR Tychy discovery from
          the calendar response through date listings and event detail pages.
        preconditions: >-
          The production image can reach mosir.tychy.pl over its normal HTTP
          network path.
        priority: medium
        automated: true
        steps:
          - action: Run the production-image MOSiR live smoke probe for Tychy over the next 30 days.
            expected: The probe succeeds when discovery is healthy, including when the valid window has no events.
          - action: Inspect any normalized event returned by the live source.
            expected: It has a namespaced MOSiR ID, canonical mosir.tychy.pl URL, city Tychy, and no Admission value.

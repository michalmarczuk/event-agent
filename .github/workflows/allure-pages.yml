name: Publish Allure Report

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  test-report:
    runs-on: ubuntu-latest
    outputs:
      report_ready: ${{ steps.report_ready.outputs.ready }}
      pytest_exit_code: ${{ steps.pytest.outputs.exit_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run offline tests with Allure
        id: pytest
        run: |
          set +e
          pytest -q \
            --alluredir=allure-results \
            --clean-alluredir
          pytest_exit_code=$?
          set -e
          echo "exit_code=${pytest_exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Add Allure environment metadata
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          UPSTREAM_WORKFLOW_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'not_applicable' }}
        run: |
          mkdir -p allure-results
          short_sha="${COMMIT_SHA:0:7}"
          {
            echo "Project=Event Agent"
            echo "Environment=GitHub Actions"
            echo "Python=${PYTHON_VERSION}"
            echo "Branch=${BRANCH_NAME}"
            echo "Commit=${short_sha}"
            echo "UpstreamWorkflowConclusion=${UPSTREAM_WORKFLOW_CONCLUSION}"
          } > allure-results/environment.properties

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/allure.tgz" \
            --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report
          test -f allure-report/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Mark report ready
        id: report_ready
        run: echo "ready=true" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: test-report
    if: ${{ always() && !cancelled() && needs['test-report'].outputs.report_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  test-result:
    needs:
      - test-report
      - deploy
    if: ${{ always() && needs['test-report'].outputs.report_ready == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Restore pytest result after Pages deployment
        env:
          PYTEST_EXIT_CODE: ${{ needs['test-report'].outputs.pytest_exit_code }}
        run: |
          if [ "${PYTEST_EXIT_CODE}" -ne 0 ]; then
            echo "::error::pytest exited with code ${PYTEST_EXIT_CODE}; the Allure report was generated and deployed before restoring the failure."
            exit 1
          fi
          echo "pytest passed; the Allure report was generated and deployed."

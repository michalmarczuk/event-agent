name: Publish Allure Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  test-report:
    runs-on: ubuntu-latest
    outputs:
      report_ready: ${{ steps.report_ready.outputs.ready }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run offline tests with Allure
        id: pytest
        continue-on-error: true
        run: |
          pytest -q \
            --alluredir=allure-results \
            --clean-alluredir

      - name: Add Allure environment metadata
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p allure-results
          short_sha="${COMMIT_SHA:0:7}"
          {
            echo "Project=Event Agent"
            echo "Environment=GitHub Actions"
            echo "Python=${PYTHON_VERSION}"
            echo "Branch=${BRANCH_NAME}"
            echo "Commit=${short_sha}"
          } > allure-results/environment.properties

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/allure.tgz" \
            --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report
          test -f allure-report/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Mark report ready
        id: report_ready
        run: echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Preserve pytest failure
        if: ${{ steps.pytest.outcome == 'failure' }}
        run: |
          echo "::error::pytest failed; the Allure report was still generated and uploaded."
          exit 1

  deploy:
    needs: test-report
    if: ${{ always() && !cancelled() && needs['test-report'].outputs.report_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

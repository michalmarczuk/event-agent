name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pytest_exit_code: ${{ steps.pytest.outputs.exit_code }}
      python_version: ${{ steps.python.outputs.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run offline tests with Allure
        id: pytest
        env:
          QASE_MODE: off
        run: |
          mkdir -p allure-results
          set +e
          pytest -q \
            --alluredir=allure-results \
            --clean-alluredir \
            tests/unit \
            tests/behavioral \
            tests/integration
          pytest_exit_code=$?
          set -e
          echo "exit_code=${pytest_exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error

      - name: Preserve pytest failure status
        if: ${{ always() }}
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
        run: |
          if [ -z "${PYTEST_EXIT_CODE}" ]; then
            echo "::error::pytest did not produce an exit code."
            exit 1
          fi
          if [ "${PYTEST_EXIT_CODE}" -ne 0 ]; then
            echo "::error::pytest exited with code ${PYTEST_EXIT_CODE}; Allure results were uploaded."
            exit "${PYTEST_EXIT_CODE}"
          fi
          echo "pytest passed."

  build-production:
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/michalmarczuk/event-agent:latest
            ghcr.io/michalmarczuk/event-agent:sha-${{ github.sha }}

      - name: Keep latest 5 production container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: event-agent
          package-type: container
          min-versions-to-keep: 5

  build-test-image:
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push test-runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-runtime
          push: true
          tags: |
            ghcr.io/michalmarczuk/event-agent-tests:latest
            ghcr.io/michalmarczuk/event-agent-tests:sha-${{ github.sha }}

      - name: Keep latest 5 test container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: event-agent-tests
          package-type: container
          min-versions-to-keep: 5

  system-test:
    needs:
      - build-production
      - build-test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull immutable system-test images
        run: |
          docker pull "ghcr.io/michalmarczuk/event-agent:sha-${GITHUB_SHA}"
          docker pull "ghcr.io/michalmarczuk/event-agent-tests:sha-${GITHUB_SHA}"

      - name: Run black-box system test
        env:
          EVENT_AGENT_SYSTEM_ALLURE_DIR: ${{ github.workspace }}/allure-results/system
        run: |
          EVENT_AGENT_SYSTEM_SKIP_BUILD=1 \
          EVENT_AGENT_SYSTEM_PRODUCTION_IMAGE="ghcr.io/michalmarczuk/event-agent:sha-${GITHUB_SHA}" \
          EVENT_AGENT_SYSTEM_TEST_IMAGE="ghcr.io/michalmarczuk/event-agent-tests:sha-${GITHUB_SHA}" \
          ./scripts/run_system_tests.sh

      - name: Upload system Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-system
          path: allure-results/system
          if-no-files-found: error

  qase-regression:
    needs: system-test
    if: ${{ needs['system-test'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Publish offline regression to Qase
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        run: ./scripts/run_qase_regression.sh

  allure-report:
    needs:
      - offline-tests
      - build-production
      - build-test-image
      - system-test
      - qase-regression
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download offline and system Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results*
          path: allure-inputs
          merge-multiple: false

      - name: Merge Allure results without overwriting files
        env:
          SYSTEM_TEST_RESULT: ${{ needs['system-test'].result }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          inputs = Path("allure-inputs")
          output = Path("allure-results")
          output.mkdir()
          for name in ("allure-results", "allure-results-system"):
              artifact = inputs / name
              if not artifact.is_dir():
                  if name == "allure-results" or os.environ["SYSTEM_TEST_RESULT"] == "success":
                      raise SystemExit(f"Missing Allure artifact: {name}")
                  continue
              for source in sorted(artifact.iterdir()):
                  destination = output / source.name
                  if destination.exists():
                      raise SystemExit(f"Allure filename collision: {source.name}")
                  with source.open("rb") as reader, destination.open("xb") as writer:
                      shutil.copyfileobj(reader, writer)
          PY

      - name: Add Allure environment metadata
        env:
          PYTHON_VERSION: ${{ needs['offline-tests'].outputs.python_version }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TESTS_CONCLUSION: ${{ needs['offline-tests'].result }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          {
            echo "Project=Event Agent"
            echo "Environment=GitHub Actions"
            echo "Python=${PYTHON_VERSION}"
            echo "Branch=${BRANCH_NAME}"
            echo "Commit=${short_sha}"
            echo "TestsConclusion=${TESTS_CONCLUSION}"
          } > allure-results/environment.properties

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/allure.tgz" \
            --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report
          test -f allure-report/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-pages:
    needs: allure-report
    if: ${{ always() && !cancelled() && needs['allure-report'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
